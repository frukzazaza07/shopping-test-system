# DEVELOPMENT ONLY - mounted by docker-compose.dev.yml, which also attaches nginx to the backend
# network and runs the API with ASPNETCORE_ENVIRONMENT=Development. The production image never
# contains this file and cannot reach the API at all.

location = /swagger {
    # Relative Location header: nginx listens on 80 inside the container but is published on
    # NGINX_PORT (8088), so an absolute redirect would point the browser at the wrong port.
    absolute_redirect off;
    return 301 /swagger/;
}

# Swagger "Try it out": /swagger/try/api/... -> API /api/... (the X-Api-Key header is still required).
location /swagger/try/ {
    proxy_pass http://backend:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# Swagger UI + OpenAPI document (served by the API only in Development).
location /swagger/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
