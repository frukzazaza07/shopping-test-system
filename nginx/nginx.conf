worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;              # hide nginx version
    client_max_body_size 1m;

    # Basic per-IP rate limit (protects the order endpoint from being hammered)
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=20r/s;
    limit_req_status 429;

    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Probe for nginx itself (k8s liveness/readiness) - does not depend on the frontend.
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok";
        }

        # Environment-specific extras. Empty in production; docker-compose.dev.yml mounts
        # nginx/dev/*.conf here (e.g. /swagger -> .NET API).
        include /etc/nginx/extra/*.conf;

        # Only the Next.js app is published. The .NET API and Postgres are NOT routed here -
        # they live on an internal Docker network that nginx is not even attached to.
        location / {
            limit_req zone=per_ip burst=40 nodelay;

            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # $http_host keeps the port so Next.js Server Actions' Origin/Host CSRF check passes
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Needed for React streaming / Partial Prerendering
            proxy_buffering off;
        }
    }
}
