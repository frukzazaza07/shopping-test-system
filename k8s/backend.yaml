apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2                      # HPA takes over from here (2..6)
  strategy:
    rollingUpdate:
      maxUnavailable: 0            # never drop below current capacity during a deploy
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: stock-cart-backend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: DB_HOST
              valueFrom: { configMapKeyRef: { name: stock-cart-config, key: DB_HOST } }
            - name: DB_MAX_POOL_SIZE
              valueFrom: { configMapKeyRef: { name: stock-cart-config, key: DB_MAX_POOL_SIZE } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: stock-cart-secrets, key: POSTGRES_DB } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: stock-cart-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: stock-cart-secrets, key: POSTGRES_PASSWORD } }
            - name: ConnectionStrings__Default
              value: Host=$(DB_HOST);Port=5432;Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD);GSS Encryption Mode=Disable;Maximum Pool Size=$(DB_MAX_POOL_SIZE)
            - name: Security__ApiKey
              valueFrom: { secretKeyRef: { name: stock-cart-secrets, key: API_KEY } }
            - name: Cors__AllowedOrigins__0
              valueFrom: { configMapKeyRef: { name: stock-cart-config, key: FRONTEND_ORIGIN } }
            # Redis = cache + stock gate (optional; Postgres alone still works if Redis is down)
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: stock-cart-secrets, key: REDIS_PASSWORD } }
            - name: Redis__ConnectionString
              value: redis:6379,password=$(REDIS_PASSWORD)
            - name: Redis__StockSyncSeconds
              valueFrom: { configMapKeyRef: { name: stock-cart-config, key: REDIS_STOCK_SYNC_SECONDS } }
          readinessProbe:            # DB reachable + migrations applied
            httpGet: { path: /health/ready, port: 8080 }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:             # process only - a DB outage must not restart every pod
            httpGet: { path: /health/live, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          lifecycle:
            # Give kube-proxy time to stop routing here before SIGTERM; .NET then drains
            # in-flight orders (HostOptions.ShutdownTimeout = 20s).
            preStop:
              exec: { command: ["sleep", "5"] }
          resources:
            requests: { cpu: 200m, memory: 128Mi }   # HPA % is relative to the CPU request
            limits: { memory: 512Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
