# Same nginx image/config as docker-compose (rate limit, security headers, streaming).
# Exposed with a LoadBalancer Service: Docker Desktop maps it to localhost:8088.
# On a cloud cluster you would typically put a Gateway API / Ingress controller here instead.
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  type: LoadBalancer
  selector:
    app: nginx
  ports:
    - port: 8088
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: stock-cart-nginx
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /nginx-health, port: 80 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /nginx-health, port: 80 }
            periodSeconds: 10
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
